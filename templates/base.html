<!DOCTYPE html>
<html lang="{{ lang }}">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Kadar Przeprowadzki - Bielsko Biała i cała Poslka</title>
        <link rel="icon" type="image/jpg" href="static/logo.jpg" class="icon-image">
        <link rel="shortcut icon" type="image/jpg" href="static/logo.jpg" class="icon-image">

        <link rel="dns-prefetch" href="//fonts.googleapis.com">
        <link rel="dns-prefetch" href="//fonts.gstatic.com">
        <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preload" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Great+Vibes&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
        <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Great+Vibes&display=swap"></noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.min.css') }}?v=20250924">
        <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" media="print" onload="this.media='all'">
        <link rel="stylesheet" href="https://unpkg.com/glightbox/dist/css/glightbox.min.css" media="print" onload="this.media='all'">
        <link rel="preload" href="{{ url_for('static', filename='slides/horizontal1.webp') }}" as="image">


        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/Flip.min.js" defer></script>
        <script src="https://unpkg.com/swiper/swiper-bundle.min.js" defer></script>
        <script src="https://unpkg.com/glightbox/dist/js/glightbox.min.js" defer></script>
        <script src="{{ url_for('static', filename='js/slider.js') }}"></script>
        <script src="{{ url_for('static', filename='js/gallery.js') }}" defer></script>
        <script src="{{ url_for('static', filename='js/truck-scroll-global.js') }}" defer></script>
        <script src="{{ url_for('static', filename='js/text-flyin.js') }}" defer></script>
        <script src="{{ url_for('static', filename='js/language-selector.js') }}?v=20250924" defer></script>

    </head>

    <body>
        <div id="main-content">
            {% block content %}{% endblock %}
        </div>

        <!--Easter egg-->
        <script src="{{ url_for('static', filename='js/easter-egg.js') }}"></script>

        <video id="the-world-bg" autoplay muted playsinline>
            <source src="/static/Za-Warudo.mp4" type="video/mp4" defer>
        </video>
    </body>
</html>

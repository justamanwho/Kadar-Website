{% extends "base.html" %}

{% block content %}


<div class="title">
  <h1>{{ translations.title }}</h1>
</div>

<div class="slider">
  <div class="slides">
    <img src="static/slides/horizontal1.jpg" class="slide active" />
    <img src="static/slides/horizontal2.jpg" class="slide" />
    <img src="static/slides/horizontal3.jpg" class="slide" />
  </div>

  <div class="bottom-center">
    <h3 class="luxury-heading">Przeprowadzka jest łatwa</h3>

    <div class="buttons">
      <button class="btn primary">Zadzwoń 601 896 568</button>
    </div>

    <div class="indicators">
      <span class="dot active" onclick="showSlide(0)"></span>
      <span class="dot" onclick="showSlide(1)"></span>
      <span class="dot" onclick="showSlide(2)"></span>
    </div>
  </div>
</div>


<section class="gallery-wrap">
  <h2>Galeria zdjęć z przeprowadzek</h2>

  <div class="gallery" id="moves-gallery">
    {% for i in range(2, 16) %}
      <a href="{{ url_for('static', filename='gallery/gallery (' ~ i ~ ').jpg') }}"
         class="gallery__item"
         data-gallery="moves">
        <img
          src="{{ url_for('static', filename='gallery/gallery (' ~ i ~ ').jpg') }}"
          alt="Przeprowadzka – zdjęcie {{ i }}"
          loading="lazy">
      </a>
    {% endfor %}
  </div>
</section>


<section class="map-section">
  <div class="map-embed">
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10322.750917929282!2d19.0259118!3d49.811688!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4716a15d382140f9%3A0xb209a06201eb6cf6!2sKadar%20Przeprowadzki!5e0!3m2!1spl!2spl!4v1694700000000!5m2!1spl!2spl"
      width="100%"
      height="450"
      style="border:0;"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

</section>

{% endblock %}

# Redirect HTTP to HTTPS (both www and non-www)
server {
    listen 80;
    server_name kadarprzeprowadzki.pl www.kadarprzeprowadzki.pl;
    return 301 https://kadarprzeprowadzki.pl$request_uri;  # Force non-www
}

# Redirect www to non-www for HTTPS
server {
    listen 443 ssl;
    server_name www.kadarprzeprowadzki.pl;

    ssl_certificate     /etc/ssl/certs/kadarprzeprowadzki.pl.pem;
    ssl_certificate_key /etc/ssl/private/kadarprzeprowadzki.pl.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # This is the critical part - redirect to non-www
    return 301 https://kadarprzeprowadzki.pl$request_uri;
}

# Main server block for the correct domain
server {
    listen 443 ssl;
    server_name kadarprzeprowadzki.pl;

    ssl_certificate     /etc/ssl/certs/kadarprzeprowadzki.pl.pem;
    ssl_certificate_key /etc/ssl/private/kadarprzeprowadzki.pl.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Optional: Add trailing slash removal (but don't do it for the root)
    # This is handled better in Flask for now

    location /static/ {
        alias /home/ec2-user/Kadar-Website/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /translations/ {
        alias /home/ec2-user/Kadar-Website/translations/;
    }

    location /templates/ {
        alias /home/ec2-user/Kadar-Website/templates/;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}